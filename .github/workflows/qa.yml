name: QA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run lint
      - run: npm run build
      - run: npm run test:api
      - run: npm run test:python
      - run: npm run test:world
      - run: npm run test:cloud
      - run: npm run test:editor
      - run: npm run test:games
      - run: npm run test:mechanisms
      - run: npm run test:practice
